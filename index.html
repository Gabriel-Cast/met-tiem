<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>IE-Pro v3.6 - Ingeniería Industrial</title>
  <style>
    :root {
      --vh: 1vh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: calc(var(--vh, 1vh) * 100);
      overflow: hidden;
      position: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      touch-action: none;
    }

    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Estilos adaptados de tu interfaz IE-Pro */
    .app-header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-logo {
      background: #1f6feb;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .app-title h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .app-title span {
      font-size: 0.75rem;
      color: #8b949e;
    }

    .scrollable-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 16px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
    }

    .timer-display {
      font-size: 2.8rem;
      font-weight: bold;
      text-align: center;
      color: #f0883e;
      font-family: monospace;
      margin: 16px 0;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header class="app-header">
      <div class="app-logo">20</div>
      <div class="app-title">
        <h1>IE-Pro <span style="background:#388bfd; color:white; padding:2px 6px; border-radius:4px;">v3.6</span></h1>
        <span>Ingeniería Industrial & Métodos y Tiempos</span>
      </div>
    </header>
    
    <div class="scrollable-content">
      <div class="card">
        <h3>Cronómetro Digital</h3>
        <div class="timer-display">00:00.00</div>
        <p style="text-align:center; color:#8b949e;">Tomas: 12</p>
      </div>

      <div class="card">
        <h3>Elemento / Operación Activa</h3>
        <p style="margin-top: 8px; padding: 10px; background: #21262d; border-radius: 6px;">1. Tomar block de motor y fijación</p>
      </div>
    </div>
  </div>

  <script>
    // Ajuste dinámico de altura para celulares (elimina barras flotantes)
    const setDynamicHeight = () => {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    };
    window.addEventListener('resize', setDynamicHeight);
    window.addEventListener('orientationchange', setDynamicHeight);
    setDynamicHeight();

    // Previene el rebote elástico de la pantalla completa
    document.body.addEventListener('touchmove', (e) => {
      if (!e.target.closest('.scrollable-content')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>

</body>
</html>
