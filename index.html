<!DOCTYPE html><!-- v3.8.0-clean -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IE-Pro v3.8 - Ingeniería Industrial</title>

    <!-- Forzar destrucción total de Service Workers viejos -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) { registration.unregister(); }
            });
        }
    </script>

    <link rel="manifest" href="./manifest.json?v=380">
    <link rel="icon" type="image/png" sizes="512x512" href="./app.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; touch-action: manipulation; }
        .app-card { background-color: #161b22; border: 1px solid #30363d; }
        button, select, input { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6">
    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- Header -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-[#161b22] border border-[#30363d] p-4 rounded-xl gap-4 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-lg text-white font-bold text-xl shadow">⏱</div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">IE-Pro <span class="text-emerald-400 text-xs">v3.8 Clean</span></h1>
                    <p class="text-xs text-gray-400">Ingeniería Industrial & Tiempos</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="enviarAGoogleSheets()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow">☁️ Guardar en Sheets</button>
            </div>
        </header>

        <!-- Sección Principal -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- Cronómetro Elemental -->
            <div class="lg:col-span-5 space-y-4">
                <div class="app-card p-4 rounded-xl shadow-lg space-y-3">
                    <div class="flex justify-between items-center text-xs text-gray-400">
                        <span>CRONÓMETRO ELEMENTAL</span>
                        <span id="txt-tomas">Tomas: 0</span>
                    </div>
                    <div class="bg-[#0b0f19] border border-[#30363d] py-6 rounded-xl text-center">
                        <div id="display-cronometro" class="text-4xl md:text-5xl font-mono font-extrabold text-amber-500">00:00.00</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleCronometro()" id="b-start" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-lg shadow">▶ Iniciar / Parar</button>
                        <button onclick="registrarLap()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold py-2.5 rounded-lg shadow">⏱ Registrar Lap</button>
                        <button onclick="resetCronometro()" class="bg-[#21262d] text-gray-300 border border-[#30363d] px-3 py-2.5 rounded-lg">🔄</button>
                    </div>
                </div>

                <!-- Elemento Activo -->
                <div class="app-card p-4 rounded-xl shadow-lg space-y-3">
                    <label class="text-xs font-bold text-gray-300">ELEMENTO ACTIVO:</label>
                    <select id="select-elemento" class="w-full bg-[#0b0f19] border border-[#30363d] text-gray-200 text-xs rounded-lg p-2.5">
                    </select>
                </div>
            </div>

            <!-- Ciclo Total y Tabla -->
            <div class="lg:col-span-7 space-y-4">
                <div class="app-card p-4 rounded-xl shadow-lg space-y-4">
                    
                    <!-- Tarjeta Ciclo Total -->
                    <div class="bg-[#0b0f19] border border-[#30363d] p-3.5 rounded-xl flex items-center justify-between">
                        <div>
                            <span class="text-[10px] text-gray-400 uppercase tracking-wider block">TIEMPO CICLO TOTAL OPERACIÓN</span>
                            <div class="text-2xl font-mono font-extrabold text-amber-400">
                                <span id="txt-ciclo-total">0.00</span> <span class="text-sm">s</span>
                            </div>
                        </div>
                        <div class="flex gap-1.5">
                            <button onclick="toggleCronometroCiclo()" id="b-ciclo-start" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-lg">▶ Iniciar</button>
                            <button onclick="resetCronometroCiclo()" class="bg-[#21262d] text-gray-300 border border-[#30363d] text-xs p-2 rounded-lg">🔄</button>
                        </div>
                    </div>

                    <!-- Tabla -->
                    <div class="overflow-x-auto border border-[#30363d] rounded-xl">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-[#0b0f19] text-[10px] text-gray-400 border-b border-[#30363d]">
                                    <th class="p-2.5">ELEMENTO</th>
                                    <th class="p-2.5 text-center">TOMAS</th>
                                    <th class="p-2.5 text-right">PROMEDIO (S)</th>
                                    <th class="p-2.5 text-center">ACCIÓN</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla-elementos" class="text-xs divide-y divide-[#30363d]"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Limpio y Robusto -->
    <script>
        let timerInterval = null, tiempoInicioElemento = 0, acumuladoPausaElemento = 0, estaCorriendo = false;
        let cicloInterval = null, cicloInicio = 0, cicloAcumuladoPausa = 0, estaCorriendoCiclo = false;
        let contadorTomasTotales = 0, tiempoAcumuladoGeneralMs = 0;

        let elementosEstudio = [
            { id: 1, nombre: "1. Alineación de conformadores", tomas: [] },
            { id: 2, nombre: "2. Es cuadrado", tomas: [] },
            { id: 3, nombre: "3. Colocación de desmoldante", tomas: [] }
        ];

        window.onload = function() {
            actualizarSelect();
            renderTabla();
        };

        function actualizarSelect() {
            let sel = document.getElementById('select-elemento');
            sel.innerHTML = "";
            elementosEstudio.forEach((el, idx) => {
                let opt = document.createElement('option');
                opt.value = idx;
                opt.text = el.nombre;
                sel.appendChild(opt);
            });
        }

        function renderTabla() {
            let cuerpo = document.getElementById('cuerpo-tabla-elementos');
            cuerpo.innerHTML = "";
            elementosEstudio.forEach((el, idx) => {
                let prom = el.tomas.length > 0 ? (el.tomas.reduce((a,b)=>a+b,0)/el.tomas.length).toFixed(2) : "0.00";
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2.5">${el.nombre}</td>
                    <td class="p-2.5 text-center font-mono">${el.tomas.length}</td>
                    <td class="p-2.5 text-right font-mono text-amber-400">${prom}s</td>
                    <td class="p-2.5 text-center"><button onclick="limpiarTomas(${idx})" class="bg-red-900/40 text-red-300 px-2 py-1 rounded">🗑</button></td>
                `;
                cuerpo.appendChild(tr);
            });
        }

        function limpiarTomas(idx) {
            elementosEstudio[idx].tomas = [];
            renderTabla();
        }

        // Ciclo Total (Inicia/Pausa ambos al mismo tiempo)
        function toggleCronometroCiclo() {
            let btn = document.getElementById('b-ciclo-start');
            if (!estaCorriendoCiclo) {
                estaCorriendoCiclo = true;
                btn.innerText = "⏸ Pausar";
                cicloInicio = Date.now() - cicloAcumuladoPausa;
                cicloInterval = setInterval(() => {
                    let t = Date.now() - cicloInicio;
                    document.getElementById('txt-ciclo-total').innerText = (t / 1000).toFixed(2);
                }, 10);

                if (!estaCorriendo) toggleCronometro();
            } else {
                estaCorriendoCiclo = false;
                clearInterval(cicloInterval);
                cicloAcumuladoPausa = Date.now() - cicloInicio;
                btn.innerText = "▶ Reanudar";

                if (estaCorriendo) pausarCronometro();
            }
        }

        function resetCronometroCiclo() {
            estaCorriendoCiclo = false;
            clearInterval(cicloInterval);
            cicloAcumuladoPausa = 0;
            cicloInicio = 0;
            document.getElementById('b-ciclo-start').innerText = "▶ Iniciar";
            document.getElementById('txt-ciclo-total').innerText = "0.00";
        }

        // Cronómetro Elemental
        function toggleCronometro() {
            let btn = document.getElementById('b-start');
            if (!estaCorriendo) {
                estaCorriendo = true;
                btn.innerText = "⏸ Pausar";
                tiempoInicioElemento = Date.now() - acumuladoPausaElemento;
                timerInterval = setInterval(() => {
                    let t = Date.now() - tiempoInicioElemento;
                    document.getElementById('display-cronometro').innerText = formatear(t);
                }, 10);
            } else {
                pausarCronometro();
            }
        }

        function pausarCronometro() {
            if (!estaCorriendo) return;
            estaCorriendo = false;
            clearInterval(timerInterval);
            acumuladoPausaElemento = Date.now() - tiempoInicioElemento;
            document.getElementById('b-start').innerText = "▶ Reanudar";
        }

        function resetCronometro() {
            if(confirm("¿Reiniciar tomas de elementos?")) {
                pausarCronometro();
                acumuladoPausaElemento = 0;
                tiempoInicioElemento = 0;
                document.getElementById('display-cronometro').innerText = "00:00.00";
                elementosEstudio.forEach(el => el.tomas = []);
                renderTabla();
            }
        }

        function registrarLap() {
            if (!estaCorriendo) return;
            let tMs = Date.now() - tiempoInicioElemento;
            if (tMs < 50) return;
            let tSeg = parseFloat((tMs / 1000).toFixed(2));

            let sel = document.getElementById('select-elemento');
            let idx = parseInt(sel.value);
            if (!isNaN(idx) && elementosEstudio[idx]) {
                elementosEstudio[idx].tomas.push(tSeg);
                renderTabla();
                sel.value = (idx + 1) % elementosEstudio.length;
            }
            tiempoInicioElemento = Date.now();
        }

        function formatear(ms) {
            let min = Math.floor(ms / 60000);
            let seg = Math.floor((ms % 60000) / 1000);
            let cent = Math.floor((ms % 1000) / 10);
            return (min < 10 ? "0" : "") + min + ":" + (seg < 10 ? "0" : "") + seg + "." + (cent < 10 ? "0" : "") + cent;
        }

        function enviarAGoogleSheets() {
            alert("Datos listos para enviar a Google Sheets.");
        }
    </script>
</body>
</html>
